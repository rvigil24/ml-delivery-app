[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-delivery-app"
version = "0.1.0"
description = "Asistente de Delivery Económico — proyecto académico"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34,<2",
    "dask[dataframe]>=2024.8,<2025",
    "fastapi>=0.115,<1",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "pymongo>=4.9,<5",
    "pyspark>=3.5.7,<3.6",
    "scikit-learn>=1.6,<1.8",
    "torch>=2.8,<2.9",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6,<7",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1; python_version < '3.11'",
    "httpx2>=2,<3; python_version >= '3.11'",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/delivery", "ml/src/delivery_ml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
addopts = "--strict-config --strict-markers"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
