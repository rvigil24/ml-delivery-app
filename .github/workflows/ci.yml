name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Instalar solo dependencias necesarias para las pruebas básicas
        run: |
          uv export --locked --no-emit-project --prune torch --prune pyspark --prune dask --prune matplotlib --output-file "$RUNNER_TEMP/requirements.txt"
          uv pip install --system --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --system --no-deps .
      - name: Dominio, contrato HTTP y arranque cloud
        run: python -m pytest backend/tests/test_domain.py backend/tests/test_api.py backend/tests/test_food_catalog.py backend/tests/test_business_orders.py backend/tests/test_courier_routes_api.py backend/tests/test_cloud_start.py -q

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Construir sin publicar imagen
        run: docker build --tag ml-delivery-api:ci .
